[project]
name = "sdl-common"
version = "0.1.0"
description = "Shared plumbing for lab services: app factory, health/readiness, logging, metrics, Postgres, migrations"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    "pydantic-settings>=2.15.0",
    "prometheus-fastapi-instrumentator>=8.1.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary,pool]>=3.3.6"]
kafka = ["confluent-kafka>=2.15.1"]
redis = [
    "redis>=8.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdl_common"]
