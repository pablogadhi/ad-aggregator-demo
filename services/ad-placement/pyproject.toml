[project]
name = "ad-placement"
version = "0.1.0"
description = "ad-placement — see design/spec.md"
requires-python = ">=3.12"
# Add component clients as needed, e.g. "sdl-common[postgres]", "confluent-kafka", "redis", "boto3".
dependencies = [
    "sdl-common[postgres]",
]

[tool.uv.sources]
sdl-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ad_placement"]
