[project]
name = "auth"
version = "0.1.0"
description = "auth — see design/spec.md"
requires-python = ">=3.12"
# Add component clients as needed, e.g. "sdl-common[postgres]", "confluent-kafka", "redis", "boto3".
dependencies = [
    "pyjwt[crypto]>=2.15.0",
    "sdl-common",
]

[tool.uv.sources]
sdl-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auth"]
