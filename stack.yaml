# What this design runs — written by the architect step of /build-design (see design/spec.md).
#   make up      -> creates the cluster, installs the platform, then each component below (in order)
#   make dev/ci  -> Tilt builds + deploys the services, pipelines and client below
# `instance:` installs a component more than once (default = the component name); the instance
# names its resources and its conn secret `<instance>-conn`.
name: ad-aggregator

components:
  - { name: postgres, profile: ha }                          # ads DB -> postgres-conn
  - { name: postgres, instance: analytics-db, profile: ha }  # analytics DB -> analytics-db-conn
  - { name: kafka, profile: ha }
  - { name: redis, profile: ha }
  - { name: aws, profile: small }                            # Floci S3: Flink checkpoints + HA
  - { name: flink, profile: small }                          # operator only; the job is a pipeline

services:
  - auth
  - ad-placement
  - click-receiver
  - analytics

pipelines:
  - click-aggregator

client: true           # client/
