# Single entry point into the cluster: http://localhost:8080
#   - app traffic:   path-based on any host          (http://localhost:8080/api/<service>/...)
#   - tool UIs:      host-based on *.localhost        (routes.yaml)
# Envoy Gateway also plays the "API Gateway" box from design diagrams: rate limiting, JWT auth,
# retries/timeouts are configured per route with BackendTrafficPolicy / SecurityPolicy (design-owned).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: sdl-proxy
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        # One replica per zone (3 zones, 4 workers: zone-a has 2 nodes, zone-b/zone-c have 1 each) so
        # losing a whole zone (docker stop on its only node) leaves two proxy replicas up in the other
        # zones instead of dropping to a single point of failure. DoNotSchedule (not ScheduleAnyway):
        # with exactly 1 replica per zone this is an even spread (skew 0), so it schedules cleanly, and
        # it's worth refusing a 2-in-one-zone placement rather than silently accepting it.
        replicas: 3
        pod:
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  gateway.envoyproxy.io/owning-gateway-name: sdl
      envoyPDB:
        # Keeps 2 of 3 zone-spread replicas up during voluntary disruption (node drain, chart upgrade).
        maxUnavailable: 1
      envoyService:
        type: NodePort
        # Cluster policy: the NodePort is mapped on the control-plane node, where no envoy pod runs.
        externalTrafficPolicy: Cluster
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                - port: 80
                  nodePort: 30080

---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: sdl
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: sdl-proxy
    namespace: envoy-gateway-system

---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: sdl
  namespace: envoy-gateway-system
spec:
  gatewayClassName: sdl
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All

# Scrape the Envoy proxies' own stats (admin port 19001, container port name "metrics") so
# envoy_cluster_upstream_rq_total / envoy_http_downstream_rq_* etc. show up in Prometheus —
# without this there was no way to diagnose the 503/504s during the zone-b outage (chaos #7).
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: envoy-proxy
  namespace: envoy-gateway-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: envoy
      app.kubernetes.io/component: proxy
  podMetricsEndpoints:
    - path: /stats/prometheus
      port: metrics
