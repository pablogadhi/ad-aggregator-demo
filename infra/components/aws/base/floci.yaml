# Floci — MIT-licensed, LocalStack-compatible AWS emulator (S3, SQS, DynamoDB, …) on port 4566.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aws-data
  namespace: data
  labels: { app.kubernetes.io/name: aws }
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 5Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aws
  namespace: data
  labels: { app.kubernetes.io/name: aws }
spec:
  replicas: 1
  strategy: { type: Recreate }     # RWO volume
  selector:
    matchLabels: { app.kubernetes.io/name: aws }
  template:
    metadata:
      labels: { app.kubernetes.io/name: aws }
    spec:
      containers:
        - name: floci
          image: floci/floci:2.1.0
          env:
            - { name: FLOCI_DEFAULT_REGION, value: us-east-1 }
            - { name: FLOCI_HOSTNAME, value: aws.data.svc.cluster.local }
            - { name: FLOCI_BASE_URL, value: "http://aws.data.svc.cluster.local:4566" }
            # every write is flushed to the volume -> buckets/objects survive pod restarts
            - { name: FLOCI_STORAGE_MODE, value: persistent }
            - { name: FLOCI_STORAGE_PERSISTENT_PATH, value: /app/data }
          ports:
            - { name: http, containerPort: 4566 }
          readinessProbe:
            httpGet: { path: /_localstack/health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /_localstack/health, port: http }
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /app/data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: aws-data }
---
apiVersion: v1
kind: Service
metadata:
  name: aws
  namespace: data
  labels: { app.kubernetes.io/name: aws }
spec:
  selector: { app.kubernetes.io/name: aws }
  ports:
    - { name: http, port: 4566, targetPort: http }
