apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: data
  labels: { app.kubernetes.io/name: redis }
spec:
  serviceName: redis-headless
  replicas: 1                      # overridden per profile
  podManagementPolicy: Parallel
  persistentVolumeClaimRetentionPolicy: { whenDeleted: Delete, whenScaled: Retain }
  selector:
    matchLabels: { app.kubernetes.io/name: redis }
  template:
    metadata:
      labels: { app.kubernetes.io/name: redis }
    spec:
      terminationGracePeriodSeconds: 20
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app.kubernetes.io/name: redis }
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: redis }
      containers:
        - name: redis
          image: redis:8.8.3
          command: ["sh", "/config/start.sh"]
          env:
            - { name: REDIS_MODE, value: standalone }   # overridden per profile
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
          ports:
            - { name: redis, containerPort: 6379 }
            - { name: bus, containerPort: 16379 }
          startupProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: config, mountPath: /config }
        - name: exporter
          image: oliver006/redis_exporter:v1.92.0
          env:
            - { name: REDIS_ADDR, value: "redis://localhost:6379" }
          ports:
            - { name: metrics, containerPort: 9121 }
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { memory: 64Mi }
      volumes:
        - name: config
          configMap: { name: redis-config }
  volumeClaimTemplates:
    - metadata:
        name: data
        labels: { app.kubernetes.io/name: redis }
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 1Gi }
