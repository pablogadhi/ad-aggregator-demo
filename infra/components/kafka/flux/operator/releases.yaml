apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: strimzi
  namespace: flux-system
spec:
  interval: 10m
  releaseName: strimzi
  targetNamespace: strimzi-system
  chart:
    spec:
      chart: strimzi-kafka-operator
      version: 1.2.0           # operator 1.2.0; Kafka 4.3.1 (quay.io/strimzi/kafka:1.2.0-kafka-4.3.1)
      sourceRef: { kind: HelmRepository, name: strimzi }
  install: { createNamespace: true, crds: CreateReplace, remediation: { retries: 3 } }
  upgrade: { crds: CreateReplace, remediation: { retries: 3 } }
  valuesFrom:
    - { kind: ConfigMap, name: kafka-operator-values, valuesKey: operator.yaml }
