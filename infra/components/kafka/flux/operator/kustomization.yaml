# Once per design (Kustomization kafka-operator, dependsOn platform-configs): Strimzi (watches ns data)
# and the chart repos. Its CRDs must exist before Kustomization kafka applies the Kafka CRs.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - sources.yaml
  - releases.yaml
configMapGenerator:
  - name: kafka-operator-values
    namespace: flux-system
    files:
      - operator.yaml=../../values/operator.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
