# kafbat kafka-ui (releases.yaml; fullnameOverride -> Service "kafka-ui").
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kafka-ui
  namespace: data
spec:
  parentRefs:
    - { name: sdl, namespace: envoy-gateway-system }
  hostnames: ["kafka-ui.localhost"]
  rules:
    - backendRefs:
        - { name: kafka-ui, port: 80 }
