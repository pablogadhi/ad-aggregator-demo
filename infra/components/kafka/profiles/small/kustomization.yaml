# small: a single dual-role node, RF 1. No failover; smallest footprint.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target: { kind: KafkaNodePool, name: dual-role }
    patch: |-
      - { op: replace, path: /spec/replicas, value: 1 }
      - { op: replace, path: /spec/resources, value: { requests: { cpu: 100m, memory: 768Mi }, limits: { memory: 1Gi } } }
      - { op: replace, path: /spec/jvmOptions, value: { "-Xms": 512m, "-Xmx": 512m } }
  - target: { kind: Kafka, name: kafka }
    patch: |-
      - { op: replace, path: /spec/kafka/config/default.replication.factor, value: 1 }
      - { op: replace, path: /spec/kafka/config/min.insync.replicas, value: 1 }
      - { op: replace, path: /spec/kafka/config/offsets.topic.replication.factor, value: 1 }
      - { op: replace, path: /spec/kafka/config/transaction.state.log.replication.factor, value: 1 }
      - { op: replace, path: /spec/kafka/config/transaction.state.log.min.isr, value: 1 }
