# Stable REST endpoint for "the" Flink job of the design: selects the JobManager of any
# FlinkDeployment in apps. A design with several FlinkDeployments should use <name>-rest instead.
apiVersion: v1
kind: Service
metadata:
  name: flink-rest
  namespace: apps
spec:
  selector:
    type: flink-native-kubernetes
    component: jobmanager
  ports:
    - { name: rest, port: 8081, targetPort: 8081 }

---
# Connection contract: Secret flink-conn in namespace apps
apiVersion: v1
kind: Secret
metadata:
  name: flink-conn
  namespace: apps
  labels:
    sdl.dev/conn: "true"
type: Opaque
stringData:
  REST_URL: http://flink-rest.apps.svc.cluster.local:8081
